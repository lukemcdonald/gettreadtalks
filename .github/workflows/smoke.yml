name: Smoke

on:
  deployment_status:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:
    inputs:
      base-url:
        default: https://www.gettreadtalks.com
        description: Site URL to smoke test
        required: false
        type: string

permissions:
  contents: read

# Later this can become a reusable workflow (VOLTA-436) with only
# base-url and tag as inputs.
jobs:
  smoke:
    name: Smoke
    if: >
      github.event_name != 'deployment_status' || (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - name: Read Node version
        id: node
        run: echo "version=$(tr -d 'v[:space:]' < .nvmrc)" >> "${GITHUB_OUTPUT}"
      - name: Install pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          cache: true
          runtime: node@${{ steps.node.outputs.version }}
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps --only-shell chromium
      - name: Run smoke tests
        env:
          PLAYWRIGHT_BASE_URL: ${{ inputs.base-url || 'https://www.gettreadtalks.com' }}
        run: pnpm test:smoke
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: ignore
          name: playwright-report
          path: playwright-report/
          retention-days: 7
