name: Smoke

on:
  deployment_status:
  # Temporary: prove the CI path from this PR. Remove before ready.
  pull_request:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:
    inputs:
      base-url:
        default: https://www.gettreadtalks.com
        description: Site URL to smoke test
        required: false
        type: string

permissions:
  contents: read

# Later this can become a reusable workflow (VOLTA-436) with only
# base-url and tag as inputs.
jobs:
  smoke:
    name: Smoke
    if: >
      github.event_name != 'deployment_status' || (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    # Pin to the @playwright/test version in pnpm-lock.yaml. The version check fails if they drift.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    defaults:
      run:
        shell: bash
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      PLAYWRIGHT_SMOKE: '1'
      PLAYWRIGHT_TAG: '@smoke'
    steps:
      - uses: actions/checkout@v7
      - name: Trust workspace
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"
      - name: Read Node version
        id: node
        run: echo "version=$(tr -d 'v[:space:]' < .nvmrc)" >> "${GITHUB_OUTPUT}"
      - name: Install pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          cache: true
          runtime: node@${{ steps.node.outputs.version }}
      - name: Check Playwright version
        run: |
          set -euo pipefail
          installed="$(node -p "require('@playwright/test/package.json').version")"
          expected="1.64.1"
          if [[ "${installed}" != "${expected}" ]]; then
            echo "Installed @playwright/test ${installed} does not match mcr.microsoft.com/playwright:v${expected}-noble."
            echo "Update the smoke job container image to mcr.microsoft.com/playwright:v${installed}-noble."
            exit 1
          fi
      - name: Resolve base URL
        id: target
        env:
          DEPLOY_URL: ${{ github.event.deployment_status.environment_url }}
          INPUT_URL: ${{ inputs.base-url }}
        run: |
          set -euo pipefail
          if [[ -n "${INPUT_URL}" ]]; then
            url="${INPUT_URL}"
          elif [[ -n "${DEPLOY_URL}" ]]; then
            url="${DEPLOY_URL}"
          else
            url="https://www.gettreadtalks.com"
          fi
          echo "url=${url%/}" >> "${GITHUB_OUTPUT}"
      - name: Run smoke tests
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.target.outputs.url }}
        run: pnpm exec playwright test --grep "${PLAYWRIGHT_TAG}" --project chromium --retries=1 --timeout=30000 --workers=2
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: ignore
          name: playwright-report
          path: playwright-report/
          retention-days: 7
