name: CI

on:
  pull_request:
    types:
      - opened
      - ready_for_review
      - reopened
      - synchronize
  push:
    branches:
      - main

concurrency:
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Read Node version
        id: node
        run: echo "version=$(tr -d 'v[:space:]' < .nvmrc)" >> "${GITHUB_OUTPUT}"
      - name: Install pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          cache: true
          runtime: node@${{ steps.node.outputs.version }}
      - run: pnpm check
      - run: pnpm typecheck
      - run: pnpm test

  code-health:
    name: Code health
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Read Node version
        id: node
        run: echo "version=$(tr -d 'v[:space:]' < .nvmrc)" >> "${GITHUB_OUTPUT}"
      - name: Install pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          cache: true
          runtime: node@${{ steps.node.outputs.version }}
      - name: Audit new issues vs PR base
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          pnpm exec fallow audit --base "origin/${{ github.base_ref }}"

  e2e:
    name: E2E
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    permissions:
      contents: read
      deployments: read
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # Pin to the @playwright/test version in pnpm-lock.yaml. The version check fails if they drift.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    defaults:
      run:
        shell: bash
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - name: Install GitHub CLI
        run: |
          set -euo pipefail
          dest="${HOME}/.local/bin"
          mkdir -p "${dest}"
          curl -fsSL https://github.com/cli/cli/releases/download/v2.103.0/gh_2.103.0_linux_amd64.tar.gz \
            | tar -xz --strip-components=2 -C "${dest}" gh_2.103.0_linux_amd64/bin/gh
          echo "${dest}" >> "${GITHUB_PATH}"
      - name: Detect non-docs changes
        id: changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          files="$(
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" \
              --jq '.[].filename'
          )"
          if [[ -z "${files}" ]]; then
            echo "run=false" >> "${GITHUB_OUTPUT}"
            echo "No changed files; skipping E2E"
            exit 0
          fi
          if printf '%s\n' "${files}" | grep -qvE '(^docs/|\.md$)'; then
            echo "run=true" >> "${GITHUB_OUTPUT}"
          else
            echo "run=false" >> "${GITHUB_OUTPUT}"
            echo "Docs-only change; skipping E2E"
          fi
      - if: steps.changes.outputs.run == 'true'
        id: e2e-secrets
        name: Check preview secrets
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail
          if [[ -n "${VERCEL_AUTOMATION_BYPASS_SECRET}" ]]; then
            echo "available=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "available=false" >> "${GITHUB_OUTPUT}"
          echo "VERCEL_AUTOMATION_BYPASS_SECRET is unavailable."

          if [[ "${GITHUB_ACTOR}" == "dependabot[bot]" ]]; then
            echo "Skipping Playwright on Dependabot-triggered runs (Actions secrets are withheld)."
            exit 0
          fi

          echo "Add VERCEL_AUTOMATION_BYPASS_SECRET as an Actions secret, or also as a Dependabot secret."
          exit 1
      - if: steps.changes.outputs.run == 'true' && steps.e2e-secrets.outputs.available == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - if: steps.changes.outputs.run == 'true' && steps.e2e-secrets.outputs.available == 'true'
        name: Trust workspace
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"
      - if: steps.changes.outputs.run == 'true' && steps.e2e-secrets.outputs.available == 'true'
        name: Read Node version
        id: node
        run: echo "version=$(tr -d 'v[:space:]' < .nvmrc)" >> "${GITHUB_OUTPUT}"
      - if: steps.changes.outputs.run == 'true' && steps.e2e-secrets.outputs.available == 'true'
        name: Install pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          cache: true
          runtime: node@${{ steps.node.outputs.version }}
      - if: steps.changes.outputs.run == 'true' && steps.e2e-secrets.outputs.available == 'true'
        name: Check Playwright version
        run: |
          set -euo pipefail
          installed="$(node -p "require('@playwright/test/package.json').version")"
          expected="1.64.1"
          if [[ "${installed}" != "${expected}" ]]; then
            echo "Installed @playwright/test ${installed} does not match mcr.microsoft.com/playwright:v${expected}-noble."
            echo "Update the e2e job container image to mcr.microsoft.com/playwright:v${installed}-noble."
            exit 1
          fi
      - if: steps.changes.outputs.run == 'true' && steps.e2e-secrets.outputs.available == 'true'
        name: Wait for Vercel preview
        id: preview
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 900))
          url=""

          while (( SECONDS < deadline )); do
            deployment_id="$(
              gh api "repos/${GITHUB_REPOSITORY}/deployments?sha=${SHA}&environment=Preview&per_page=1" \
                --jq '.[0].id // empty'
            )"

            if [[ -n "${deployment_id}" ]]; then
              state="$(
                gh api "repos/${GITHUB_REPOSITORY}/deployments/${deployment_id}/statuses" \
                  --jq '.[0].state // empty'
              )"
              echo "Preview deployment ${deployment_id}: ${state}"

              if [[ "${state}" == "success" ]]; then
                url="$(
                  gh api "repos/${GITHUB_REPOSITORY}/deployments/${deployment_id}/statuses" \
                    --jq '.[0].environment_url // .[0].target_url // empty'
                )"
                break
              fi

              if [[ "${state}" == "failure" || "${state}" == "error" ]]; then
                echo "Preview deployment failed"
                exit 1
              fi
            else
              echo "No Preview deployment for ${SHA} yet"
            fi

            sleep 10
          done

          if [[ -z "${url}" ]]; then
            echo "Timed out waiting for a successful Preview deployment of ${SHA}"
            exit 1
          fi

          url="${url%/}"
          echo "Preview URL: ${url}"
          echo "url=${url}" >> "${GITHUB_OUTPUT}"
      - if: steps.changes.outputs.run == 'true' && steps.e2e-secrets.outputs.available == 'true'
        name: Run Playwright
        env:
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          PLAYWRIGHT_BASE_URL: ${{ steps.preview.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: pnpm test:e2e
      - if: ${{ !cancelled() && steps.changes.outputs.run == 'true' && steps.e2e-secrets.outputs.available == 'true' }}
        name: Surface flaky tests
        run: |
          set -euo pipefail
          summary() {
            echo '## Flaky tests'
            echo
            if [[ ! -f test-results/results.json ]]; then
              echo 'No Playwright JSON report found.'
              return 0
            fi
            if ! flakes="$(
              node -e '
                const report = JSON.parse(
                  require("node:fs").readFileSync("test-results/results.json", "utf8")
                );
                const flakes = [];
                const visit = (suite) => {
                  for (const spec of suite.specs ?? []) {
                    if (spec.tests?.some((test) => test.status === "flaky")) {
                      flakes.push(`- ${spec.file}: ${spec.title}`);
                    }
                  }
                  for (const child of suite.suites ?? []) {
                    visit(child);
                  }
                };
                for (const suite of report.suites ?? []) {
                  visit(suite);
                }
                if (flakes.length === 0) {
                  process.stdout.write("None. Every test passed on the first try.\n");
                  process.exit(0);
                }
                process.stdout.write(`${flakes.join("\n")}\n`);
              '
            )"; then
              echo 'Could not parse Playwright JSON report.'
              return 0
            fi
            printf '%s\n' "${flakes}"
          }
          summary | tee -a "${GITHUB_STEP_SUMMARY}"
      - if: ${{ !cancelled() && steps.changes.outputs.run == 'true' && steps.e2e-secrets.outputs.available == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: ignore
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - if: ${{ !cancelled() && steps.changes.outputs.run == 'true' && steps.e2e-secrets.outputs.available == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: ignore
          name: pr-assets-screenshots
          path: test-results/pr-assets/
          retention-days: 7
